<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Humara Safar</title>

*{box-sizing:border-box;margin:0}html,body{height:100%;overflow:hidden}body{background:#061022 url("assets/persian-midnight.png") center/cover fixed no-repeat;color:#eee5d5}body:before{content:"";position:fixed;inset:0;background:linear-gradient(#03071466,#030714aa);z-index:0}.center{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}.title{font-family:'Great Vibes';font-size:clamp(54px,12vw,90px);color:#ead6a2;text-shadow:0 0 45px #c9a22744}.sub{font-family:Cinzel;font-size:11px;letter-spacing:5px;color:#c9a227aa;text-transform:uppercase;margin-top:3px}.line{width:70px;height:1px;background:linear-gradient(90deg,transparent,#c9a227,transparent);margin:25px 0}.quote{font-family:'Great Vibes';font-size:clamp(18px,3.5vw,25px);line-height:1.5;color:#d8cba9cc;max-width:440px}.btn{margin-top:34px;padding:14px 32px;border:1px solid #c9a22770;border-radius:7px;background:#09101dcc;color:#e8d5a3;text-decoration:none;font-family:Cinzel;font-size:11px;letter-spacing:3px;text-transform:uppercase}.arcs{margin-top:20px;font-family:Cinzel;font-size:9px;letter-spacing:3px;color:#b8aa8a77}</style><style id="hs-scene-background">
/* ===== Humara Safar — Persian Midnight Scene Backgrounds ===== */
html, body { min-height: 100%; }
body.hs-scene-bg {
  background-position: center center !important;
  background-size: cover !important;
  background-attachment: fixed !important;
  background-repeat: no-repeat !important;
  background-color: #050812 !important;
}
body.hs-scene-bg::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background: var(--hs-scene-image) center center / cover no-repeat;
  transform: scale(1.015);
}
body.hs-scene-bg::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(3,7,18,.22), rgba(3,6,16,.66)),
    radial-gradient(circle at 50% 20%, rgba(26,71,112,.10), transparent 52%);
}
body.hs-scene-bg > * { position: relative; z-index: 0; }

/* Keep reading text comfortable over the palace background. */
body.hs-read-scene .reader-shell,
body.hs-read-scene .book-shell,
body.hs-read-scene .reader,
body.hs-read-scene .book {
  isolation: isolate;
}
body.hs-read-scene .book-page,
body.hs-read-scene .page,
body.hs-read-scene .sheet,
body.hs-read-scene .book-paper {
  box-shadow:
    0 26px 70px rgba(0,0,0,.55),
    0 0 0 1px rgba(206,167,91,.28);
}

/* Give scene-based pages a cinematic glass layer without washing out the art. */
body.hs-scene-bg .panel,
body.hs-scene-bg .card,
body.hs-scene-bg .glass,
body.hs-scene-bg .section-card {
  backdrop-filter: blur(3px);
}
@media (max-width: 700px) {
  body.hs-scene-bg::before { background-position: center center; }
  body.hs-scene-bg::after { background: linear-gradient(180deg, rgba(3,7,18,.34), rgba(3,6,16,.74)); }
}

body.hs-scene-bg { --hs-scene-image: url('assets/bg-harbour.png'); }</style>
</head><body class="hs-scene-bg"><main class="center"><div class="title">Humara Safar</div><div class="sub">Ek Adhoori Dastaan</div><div class="line"></div><div class="quote">“Kuch safar manzil tak pahunchne ke liye nahi hote,<br>balki humein badalne ke liye hote hain.”</div><a href="home.html" class="btn">Enter the Journey</a><div class="arcs">ARC 1 · ARC 2 </div></main></bPERSody></html>
